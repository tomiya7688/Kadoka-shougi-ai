name: C++ CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install C++ quality tools
        run: sudo apt-get update && sudo apt-get install --yes clang-format clang-tidy

      - name: Check C++ formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --name-only "$BASE_SHA...$GITHUB_SHA" -- '*.cpp' '*.hpp' '*.h' | xargs --no-run-if-empty clang-format --dry-run --Werror

      - name: Validate family model metadata
        run: python tools/family_metadata/script/validate_metadata.py --game shogi models/examples/family_metadata.json

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install distribution candidate
        run: cmake --install build --config Release --prefix build/stage

      - name: Installed wire compatibility
        run: ./build/stage/bin/kadoka_wire_compat ./build/stage/share/kadoka/wire_v1

      - name: Installed CLI smoke
        run: ./build/stage/bin/kadoka_shogi
