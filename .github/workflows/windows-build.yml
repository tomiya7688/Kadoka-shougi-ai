name: Windows build artifact

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and run tests
        shell: cmd
        run: build.bat

      - name: Install distribution candidate
        shell: cmd
        run: cmake --install build --config Release --prefix build\stage

      - name: Installed wire compatibility
        shell: cmd
        run: build\stage\bin\kadoka_wire_compat.exe build\stage\share\kadoka\wire_v1

      - name: Installed CLI smoke
        shell: cmd
        run: build\stage\bin\kadoka_shogi.exe

      - name: Upload developer distribution candidate
        uses: actions/upload-artifact@v4
        with:
          name: KadokaShougiAI-windows-build
          path: build/stage
          if-no-files-found: error
          retention-days: 14
